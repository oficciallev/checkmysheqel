<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: #1e1e1e; padding: 20px; border-radius: 12px; width: 100%; max-width: 400px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        input, button { width: 100%; padding: 10px; margin-top: 10px; border-radius: 6px; border: none; box-sizing: border-box; }
        input { background: #2a2a2a; color: white; border: 1px solid #444; }
        button { background: #28a745; color: white; cursor: pointer; font-weight: bold; }
        .error { color: #ff4d4d; font-size: 14px; margin-top: 8px; display: none; }
        .stat-item { background: #2a2a2a; padding: 12px; margin-top: 8px; border-radius: 6px; }
    </style>
</head>
<body>

    <div class="card" id="login-block">
        <h2>🔒 Вход в Админку</h2>
        <input type="password" id="password-input" placeholder="Введите пароль">
        <button onclick="login()">Войти</button>
        <div class="error" id="login-error">Неверный пароль</div>
    </div>

    <div class="card" id="dashboard-block" style="display: none;">
        <h2>📊 Аналитика</h2>
        <div class="stat-item">Всего открытий приложения: <strong id="app-opens">0</strong></div>
        <div class="stat-item">Всего пользователей: <strong id="total-users">0</strong></div>
        <button onclick="logout()" style="background: #dc3545;">Выйти</button>
    </div>

    <script>
        const BACKEND_URL = "http://localhost:8000";

        document.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem('admin_token');
            if (token) loadStats(token);
        });

        async function login() {
            const password = document.getElementById('password-input').value;
            const errorEl = document.getElementById('login-error');
            errorEl.style.display = 'none';

            try {
                const res = await fetch(`${BACKEND_URL}/api/admin/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });

                if (!res.ok) throw new Error();

                const data = await res.json();
                localStorage.setItem('admin_token', data.token);
                loadStats(data.token);
            } catch (err) {
                errorEl.style.display = 'block';
            }
        }

        async function loadStats(token) {
            try {
                const res = await fetch(`${BACKEND_URL}/api/admin/stats`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (!res.ok) return logout();
                const data = await res.json();
                
                document.getElementById('login-block').style.display = 'none';
                document.getElementById('dashboard-block').style.display = 'block';

                document.getElementById('app-opens').textContent = data.app_opens || 0;
                document.getElementById('total-users').textContent = data.unique_users || 0;
            } catch (err) {
                logout();
            }
        }

        function logout() {
            localStorage.removeItem('admin_token');
            document.getElementById('login-block').style.display = 'block';
            document.getElementById('dashboard-block').style.display = 'none';
        }
    </script>
</body>
</html>
