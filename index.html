<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Finance Tracker Mini App</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --danger: #ef4444;
            --border: #334155;
            --font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        [dir="rtl"] {
            text-align: right;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-family);
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 16px;
            padding-bottom: 30px;
            max-width: 500px;
            margin: 0 auto;
        }

        /* Настройки шапки (Язык + Валюта) */
        .settings-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 8px 12px;
            border-radius: 12px;
            margin-bottom: 16px;
            border: 1px solid var(--border);
        }

        .select-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .select-group select {
            background: #0f172a;
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 13px;
            outline: none;
            cursor: pointer;
        }

        /* Общие стили карточек */
        .card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .balance-title {
            color: var(--text-sub);
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .balance-value {
            font-size: 32px;
            font-weight: 700;
            color: var(--text-main);
        }

        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            color: var(--text-sub);
            font-size: 12px;
            margin-bottom: 6px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background-color: #0f172a;
            color: var(--text-main);
            font-size: 15px;
            outline: none;
        }

        input:focus, select:focus {
            border-color: var(--accent);
        }

        .btn {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: none;
            background-color: var(--accent);
            color: white;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn:active {
            background-color: var(--accent-hover);
        }

        /* Список операций */
        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .history-title {
            font-size: 16px;
            font-weight: 600;
        }

        .expense-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .expense-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background-color: #0f172a;
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        .expense-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .expense-icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: rgba(59, 130, 246, 0.1);
            color: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        .expense-amount {
            font-weight: 600;
            color: var(--danger);
        }

        .delete-btn {
            background: none;
            border: none;
            color: var(--text-sub);
            cursor: pointer;
            padding: 6px;
            margin-left: 8px;
        }

        [dir="rtl"] .delete-btn {
            margin-left: 0;
            margin-right: 8px;
        }

        .chart-container {
            position: relative;
            height: 200px;
            width: 100%;
            display: flex;
            justify-content: center;
        }

        .empty-state {
            text-align: center;
            color: var(--text-sub);
            padding: 20px 0;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <!-- Настройки Языка и Валюты -->
    <div class="settings-bar">
        <div class="select-group">
            <i class="fa-solid fa-globe" style="color: var(--text-sub);"></i>
            <select id="langSelect" onchange="changeLanguage(this.value)">
                <option value="ru">Русский</option>
                <option value="en">English</option>
                <option value="he">עברית</option>
            </select>
        </div>

        <div class="select-group">
            <i class="fa-solid fa-coins" style="color: var(--text-sub);"></i>
            <select id="currencySelect" onchange="changeCurrency(this.value)">
                <option value="ILS">₪ ILS</option>
                <option value="USD">$ USD</option>
                <option value="EUR">€ EUR</option>
                <option value="RUB">₽ RUB</option>
            </select>
        </div>
    </div>

    <!-- Общий баланс -->
    <div class="card">
        <div class="balance-title" data-i18n="totalSpent">Всего потрачено</div>
        <div class="balance-value" id="totalAmount">0 ₪</div>
    </div>

    <!-- Диаграмма -->
    <div class="card">
        <div class="history-title" style="margin-bottom: 12px;" data-i18n="analytics">Аналитика</div>
        <div class="chart-container">
            <canvas id="expenseChart"></canvas>
        </div>
    </div>

    <!-- Форма добавления -->
    <div class="card">
        <div class="history-title" style="margin-bottom: 12px;" data-i18n="addExpense">Добавить расход</div>
        
        <div class="form-group">
            <label data-i18n="amount">Сумма</label>
            <input type="number" id="amountInput" placeholder="0.00" step="0.01">
        </div>

        <div class="form-group">
            <label data-i18n="category">Категория</label>
            <select id="categorySelect">
                <!-- Заполняется из JS -->
            </select>
        </div>

        <div class="form-group">
            <label data-i18n="note">Заметка (опционально)</label>
            <input type="text" id="noteInput" placeholder="...">
        </div>

        <button class="btn" onclick="addExpense()" data-i18n="saveBtn">Сохранить</button>
    </div>

    <!-- История -->
    <div class="card">
        <div class="history-header">
            <div class="history-title" data-i18n="history">История трат</div>
        </div>
        <div class="expense-list" id="expenseList">
            <!-- Элементы создаются динамически -->
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Переводы
        const translations = {
            ru: {
                totalSpent: "Всего потрачено",
                analytics: "Аналитика",
                addExpense: "Добавить расход",
                amount: "Сумма",
                category: "Категория",
                note: "Заметка (опционально)",
                saveBtn: "Сохранить",
                history: "История трат",
                noExpenses: "Записей пока нет",
                categories: {
                    food: "🍔 Еда",
                    transport: "🚗 Транспорт",
                    home: "🏠 Дом",
                    fun: "🎉 Развлечения",
                    other: "📦 Другое"
                }
            },
            en: {
                totalSpent: "Total Spent",
                analytics: "Analytics",
                addExpense: "Add Expense",
                amount: "Amount",
                category: "Category",
                note: "Note (optional)",
                saveBtn: "Save Expense",
                history: "History",
                noExpenses: "No expenses recorded yet",
                categories: {
                    food: "🍔 Food",
                    transport: "🚗 Transport",
                    home: "🏠 Home",
                    fun: "🎉 Entertainment",
                    other: "📦 Other"
                }
            },
            he: {
                totalSpent: "סך הכל הוצאות",
                analytics: "אנליטיקה",
                addExpense: "הוסף הוצאה",
                amount: "סכום",
                category: "קטגוריה",
                note: "הערה (רשות)",
                saveBtn: "שמור הוצאה",
                history: "היסטוריית הוצאות",
                noExpenses: "אין עדיין הוצאות",
                categories: {
                    food: "🍔 אוכל",
                    transport: "🚗 תחבורה",
                    home: "🏠 בית",
                    fun: "🎉 בילויים",
                    other: "📦 אחר"
                }
            }
        };

        const currencySymbols = {
            ILS: "₪",
            USD: "$",
            EUR: "€",
            RUB: "₽"
        };

        // Состояние приложения
        let currentLang = localStorage.getItem('app_lang') || 'ru';
        let currentCurrency = localStorage.getItem('app_currency') || 'ILS';
        let expenses = JSON.parse(localStorage.getItem('my_expenses') || '[]');
        let chart = null;

        // Инициализация
        document.addEventListener("DOMContentLoaded", () => {
            document.getElementById('langSelect').value = currentLang;
            document.getElementById('currencySelect').value = currentCurrency;
            
            applyLanguage(currentLang);
            initChart();
            render();
        });

        function changeLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('app_lang', lang);
            applyLanguage(lang);
            render();
        }

        function changeCurrency(curr) {
            currentCurrency = curr;
            localStorage.setItem('app_currency', curr);
            render();
        }

        function applyLanguage(lang) {
            // Направление текста (RTL для Иврита)
            if (lang === 'he') {
                document.documentElement.setAttribute('dir', 'rtl');
            } else {
                document.documentElement.setAttribute('dir', 'ltr');
            }

            // Перевод статичных меток
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[lang][key]) {
                    el.textContent = translations[lang][key];
                }
            });

            // Обновление селекта категорий
            const catSelect = document.getElementById('categorySelect');
            catSelect.innerHTML = '';
            const cats = translations[lang].categories;
            for (let key in cats) {
                const opt = document.createElement('option');
                opt.value = key;
                opt.textContent = cats[key];
                catSelect.appendChild(opt);
            }
        }

        function formatMoney(amount) {
            const symbol = currencySymbols[currentCurrency] || "₪";
            return `${amount.toFixed(2)} ${symbol}`;
        }

        function addExpense() {
            const amountInput = document.getElementById('amountInput');
            const catSelect = document.getElementById('categorySelect');
            const noteInput = document.getElementById('noteInput');

            const amount = parseFloat(amountInput.value);
            if (isNaN(amount) || amount <= 0) {
                if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
                return;
            }

            const newExpense = {
                id: Date.now(),
                amount: amount,
                categoryKey: catSelect.value,
                note: noteInput.value.trim(),
                date: new Date().toLocaleDateString()
            };

            expenses.unshift(newExpense);
            localStorage.setItem('my_expenses', JSON.stringify(expenses));

            amountInput.value = '';
            noteInput.value = '';

            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
            render();
        }

        function deleteExpense(id) {
            expenses = expenses.filter(item => item.id !== id);
            localStorage.setItem('my_expenses', JSON.stringify(expenses));
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
            render();
        }

        function initChart() {
            const ctx = document.getElementById('expenseChart').getContext('2d');
            chart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: [],
                    datasets: [{
                        data: [],
                        backgroundColor: ['#3b82f6', '#10b981', '#f59e0b', '#ec4899', '#8b5cf6'],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: { color: '#94a3b8', font: { size: 12 } }
                        }
                    }
                }
            });
        }

        function render() {
            const listEl = document.getElementById('expenseList');
            const totalEl = document.getElementById('totalAmount');
            listEl.innerHTML = '';

            let total = 0;
            const catTotals = {};

            if (expenses.length === 0) {
                listEl.innerHTML = `<div class="empty-state">${translations[currentLang].noExpenses}</div>`;
            } else {
                expenses.forEach(item => {
                    total += item.amount;
                    catTotals[item.categoryKey] = (catTotals[item.categoryKey] || 0) + item.amount;

                    const catName = translations[currentLang].categories[item.categoryKey] || item.categoryKey;

                    const div = document.createElement('div');
                    div.className = 'expense-item';
                    div.innerHTML = `
                        <div class="expense-info">
                            <div class="expense-icon"><i class="fa-solid fa-receipt"></i></div>
                            <div>
                                <div style="font-weight:600; font-size:14px;">${catName}</div>
                                <div style="font-size:12px; color:var(--text-sub);">${item.note || item.date}</div>
                            </div>
                        </div>
                        <div style="display:flex; align-items:center;">
                            <span class="expense-amount">-${formatMoney(item.amount)}</span>
                            <button class="delete-btn" onclick="deleteExpense(${item.id})"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    `;
                    listEl.appendChild(div);
                });
            }

            totalEl.textContent = formatMoney(total);

            // Обновление диаграммы
            const labels = Object.keys(catTotals).map(k => translations[currentLang].categories[k] || k);
            const data = Object.values(catTotals);

            chart.data.labels = labels;
            chart.data.datasets[0].data = data;
            chart.update();
        }
    </script>
</body>
</html>
